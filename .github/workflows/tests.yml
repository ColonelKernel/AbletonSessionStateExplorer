name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install canonical-snapshot contract (best-effort)
        # Enables the canonical-export tests + the committed-bundle drift
        # guard. The contract lives in the separate SessionStateExplorer repo
        # and is not on PyPI; until that repo is published with the
        # schema-v0.2.0 tag this step is a no-op and the canonical-export
        # tests importorskip (CI stays green). Once published, the drift
        # guard runs for real and fails CI if exports/example_session/ is
        # stale.
        continue-on-error: true
        run: |
          pip install "canonical-snapshot @ git+https://github.com/ColonelKernel/SessionStateExplorer@schema-v0.2.0#subdirectory=packages/canonical_snapshot"
      - name: Run tests
        run: python -m pytest -q
